<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1190" viewBox="0 0 960 1190" role="img" aria-labelledby="title desc">
<title id="title">요청부터 결과 확인까지</title><desc id="desc">리뷰나 검증이 실패하면 구현으로 돌아갑니다. 위험한 변경은 G3 확인을 거칩니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="fix" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#b45309" stroke-width="1.5"/></marker></defs>
<rect width="960" height="1190" rx="20" fill="#f8fafc"/>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.heading{font-size:30px;font-weight:700;fill:#0f172a}.label{font-size:23px;font-weight:700;fill:#0f172a}.detail{font-size:18px;fill:#475569}.note{font-size:18px;fill:#92400e}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="42" y="57" class="heading">요청부터 결과 확인까지</text>

<rect x="158" y="102" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="137" class="label">요청</text><text x="183" y="167" class="detail">원하는 결과를 적습니다.</text>
<path d="M443 192 V217" class="line"/>
<rect x="158" y="224" width="570" height="90" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="183" y="259" class="label">범위 확인 · G1</text><text x="183" y="289" class="detail">무엇을 만들지 사람이 승인합니다.</text>
<path d="M443 314 V339" class="line"/>
<rect x="158" y="346" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="381" class="label">계획</text><text x="183" y="411" class="detail">작업 순서와 확인 방법을 정합니다.</text>
<path d="M443 436 V461" class="line"/>
<rect x="158" y="468" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="503" class="label">구현 · 테스트 · 단순화</text><text x="183" y="533" class="detail">코드를 고치고 관련 테스트를 통과시킵니다.</text>
<path d="M443 558 V583" class="line"/>
<rect x="158" y="590" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="625" class="label">리뷰</text><text x="183" y="655" class="detail">변경 내용과 빠진 조건을 확인합니다.</text>
<path d="M443 680 V705" class="line"/>
<rect x="158" y="712" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="747" class="label">최종 검증</text><text x="183" y="777" class="detail">수정한 코드로 테스트를 다시 실행합니다.</text>
<path d="M443 802 V827" class="line"/>
<rect x="158" y="834" width="570" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="183" y="869" class="label">교훈 기록</text><text x="183" y="899" class="detail">다음 작업에 쓸 내용만 남깁니다.</text>
<path d="M443 924 V949" class="line"/>
<rect x="158" y="956" width="570" height="90" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="183" y="991" class="label">결과 확인 · G4</text><text x="183" y="1021" class="detail">사람이 변경을 이해하고 확인합니다.</text>
<path d="M728 390 H740" fill="none" stroke="#93c5fd" stroke-width="2"/>
<rect x="740" y="341" width="194" height="85" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="837" y="372" text-anchor="middle" style="font-size:18px;fill:#1e40af;font-weight:600">위험한 변경만</text>
<text x="837" y="399" text-anchor="middle" style="font-size:18px;fill:#1e40af;font-weight:600">G3 · 설계 승인</text>
<path d="M158 635 H72 V513 H150" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#fix)"/>
<path d="M158 757 H72 V635" fill="none" stroke="#b45309" stroke-width="2.5"/>
<text x="67" y="805" text-anchor="middle" class="note" style="font-size:16px">실패하면</text>
<text x="67" y="831" text-anchor="middle" class="note" style="font-size:16px">수정</text>
<text x="42" y="1100" class="detail">같은 노드는 최대 3회 시도합니다. 한도에 도달하면 멈춥니다.</text>
<text x="42" y="1132" class="detail">미해결 결정은 사람에게 묻습니다. AI가 사람의 승인을 대신하지 않습니다.</text>
</svg>